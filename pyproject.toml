[project]
name = "supersonic-atomizer-optbyapi"
version = "0.1.0"
description = "GUI + API workflow PoC for supersonic atomizer project and case orchestration"
readme = "docs/spec.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.2",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supersonic_atomizer_optbyapi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
